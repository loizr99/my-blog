        <h3 class="demo-title">DOM events</h3>
        <div id="demo-event-click"></div>
        <div id="demo-event-properties"></div>

        <h3 class="demo-title">Window</h3>
        <div id="demo-window"></div>

        <h3 class="demo-title">DOM animations</h3>
        <div id="demo-timer"></div>

    <script>
        // demo-event-click
        {
            const maxClickCount = 10;
            let clickCount = 0;
            let el = document.createElement("span");
            document.querySelector("#demo-event-click").appendChild(el);
            
            el.textContent = "Click me!";
            el.style.cursor = "pointer";

            let onEnter = () => {
                el.style.backgroundColor = "#333333";
            }

            let onLeave = () => {
                el.style.backgroundColor = "";
            }

            let onClick = () => {
                clickCount++;
                if (clickCount < maxClickCount) {
                    el.textContent = "You clicked " + clickCount + "/" + maxClickCount +" times!";
                }
                else {
                    el.textContent = "You have reached the maximum click count!";
                    el.removeEventListener("click", onClick);
                    el.removeEventListener("mouseenter", onEnter);
                    el.removeEventListener("mouseleave", onLeave);
                    el.style.backgroundColor = "";
                    el.style.cursor = "";
                }
            };

            el.addEventListener("click", onClick);
            el.addEventListener("mouseenter", onEnter);
            el.addEventListener("mouseleave", onLeave);
        }

        // demo-event-properties
        {
            let el = document.querySelector("#demo-event-properties");
            el.textContent = "Mouse position: ";
            document.body.addEventListener("mousemove", (e) => {
                el.textContent = "Mouse position: " + e.clientX + ", " + e.clientY;
            });
        }

        // demo-window
        {
            let addParagraph = function(el, content) {
                let newEl = document.createElement("p");
                newEl.innerHTML = content;
                el.appendChild(newEl);
            }

            let el = document.querySelector("#demo-window");
            addParagraph(el, "window.location.href: " + window.location.href);
            addParagraph(el, "window.navigator.userAgent: " + window.navigator.userAgent);
            addParagraph(el, "window.outerWidth: " + window.outerWidth);
            addParagraph(el, "window.outerHeight: " + window.outerHeight);
        }

        // demo-timer
        {
            let timerState = {
                "started": false,
                "seconds": 0
            };

            let el = document.querySelector("#demo-timer");
            
            let secondsEl = document.createElement("span");

            let timerEl = document.createElement("p");
            timerEl.appendChild(secondsEl);
            timerEl.append(" seconds passed");

            // Buttons
            let timerButtonEl = document.createElement("button");
            timerButtonEl.textContent = "Start";
            timerButtonEl.addEventListener("click", () => {
                if (!timerState.started) {
                    timerState.started = true;
                    timerButtonEl.textContent = "Pause";
                }
                else {
                    timerState.started = false;
                    timerButtonEl.textContent = "Start";
                }
            });

            let timerResetButtonEl = document.createElement("button");
            timerResetButtonEl.textContent = "Reset";
            timerResetButtonEl.addEventListener("click", () => {
                timerState.seconds = 0;
            });

            // Dusty
            let dustyContainerEl = document.createElement("div");
            let dustyEl = document.createElement("img");
            dustyEl.src = "assets/dusty.png";
            dustyEl.style.padding = "10px";
            dustyEl.style.position = "relative";
            
            let dustyPositionEl = document.createElement("p");

            dustyContainerEl.appendChild(dustyEl);
            dustyContainerEl.appendChild(dustyPositionEl);

            // FPS
            let fpsEl = document.createElement("p");

            // Document update
            let last = performance.now();
            let docUpdate = function(now) {
                let framePeriod = now - last;

                // Update seconds
                if (timerState.started) {
                    timerState.seconds += framePeriod / 1000;
                }

                // Update timer text
                secondsEl.textContent = Math.round(timerState.seconds);

                // Update dusty position
                const rect = dustyEl.getBoundingClientRect();
                const bounceInterval = 5;
                const bounceIntervalHalf = bounceInterval / 2;
                const secondsMod = timerState.seconds % bounceInterval 
                const bounceX = window.outerWidth - rect.width;
                
                let transformX = 0;
                let scaleX = 1;
                if (secondsMod < bounceIntervalHalf) {
                    offsetX = Math.round(bounceX * (secondsMod / bounceIntervalHalf));
                    scaleX = 1;
                }
                else {
                    offsetX = Math.round(bounceX * ((bounceInterval - secondsMod) / bounceIntervalHalf));
                    scaleX = -1;
                }
    
                dustyEl.style.transform = `translateX(${offsetX}px) scaleX(${scaleX})`;

                dustyPositionEl.textContent = "Dusty's position: " + rect.x;

                fpsEl.textContent = "Frame Period: " + (framePeriod).toFixed(2) + "ms";
                last = now;

                window.requestAnimationFrame(docUpdate);
            }

            window.requestAnimationFrame(docUpdate);

            el.appendChild(timerEl);
            el.appendChild(timerButtonEl);
            el.appendChild(timerResetButtonEl);
            el.appendChild(dustyContainerEl);
            el.appendChild(fpsEl);
        }
    </script>
